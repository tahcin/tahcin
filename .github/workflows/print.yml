name: print run

# Reprints the profile every morning: fresh contribution data for the time
# card, fresh commit counts for Deadline Dash, a new island for Pet Island,
# and today's date on the banner page.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/print.yml"]

permissions:
  contents: write

concurrency:
  group: print-run
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - run: pip install -r src/requirements.txt

      - name: Fetch data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/fetch.py

      - name: Print every sheet
        run: python src/build.py

      - name: Commit the printout
        run: |
          git config user.name "print-run[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets src/data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "print run $(date -u +%Y-%m-%d)"
            git push
          fi
